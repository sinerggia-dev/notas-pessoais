on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  enviar-alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Enviar alertas
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/enviar_alertas_vencimento.py
